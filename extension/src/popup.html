<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Browsight Popup</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 300px; margin: 0; padding: 16px; }
      .header { display: flex; align-items: center; justify-content: flex-start; gap: 8px; margin-bottom: 4px; }
      .header img { width: 24px; height: 24px; border-radius: 4px; }
      h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
      .origin { font-size: 13px; font-weight: 500; color: #555; margin: 0 0 16px; word-break: break-all; text-align: left; }
      .row { display: flex; gap: 6px; margin-bottom: 12px; border: 0; padding: 0; margin-inline: 0; min-inline-size: 0; }
      button { font: inherit; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
      button.sel { background: #e6f1fb; border-color: #85b7eb; }
      label, .fake-label { color: #777; display: block; margin-bottom: 4px; }
      select { font: inherit; width: 100%; padding: 6px; }
      .grant { width: 100%; padding: 8px; margin-top: 10px; background: #e6f1fb; border-color: #85b7eb; font-weight: 600; }
      ul { list-style: none; margin: 12px 0 0; padding: 12px 0 0; border-top: 1px solid #eee; }
      li { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 12px; }
      li .site { flex: 1; word-break: break-all; }
      .muted { color: #777; }
      .x { cursor: pointer; color: #999; }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="icons/icon-48.png" alt="logo" />
      <h1>browsight</h1>
    </div>
    <div class="origin" id="origin">—</div>
    <div class="fake-label" id="access-lbl">Access</div>
    <fieldset class="row" id="tier" aria-labelledby="access-lbl">
      <button type="button" data-tier="read" style="flex: 1">Read only</button>
      <button type="button" data-tier="full" class="sel" style="flex: 1">Full control</button>
    </fieldset>
    <label for="timer">Allow for</label>
    <select id="timer" aria-label="Expiration Timer"></select>
    <button type="button" class="grant" id="grant">Grant access</button>
    <div class="muted" style="margin-top: 14px">Allowed sites</div>
    <ul id="list"></ul>
    <script type="module" src="popup.js"></script>
  </body>
</html>
