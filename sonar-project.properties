# Must live at the repository root: that is where the scanner looks for it.
# projectKey and organization are passed by the CI job and by test/scans/run-sonar.mjs.

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Coverage and exclusions
sonar.sources=extension,scripts,server,shared
sonar.tests=test
sonar.test.inclusions=test/**/*.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.png
sonar.cpd.exclusions=test/**/*.ts,scripts/mock_helper.ts
sonar.typescript.lcov.reportPaths=test/coverage/lcov.info
